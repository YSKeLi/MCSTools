name: Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run verify

  build:
    needs: verify
    if: github.event_name != 'pull_request' && (github.actor != 'github-actions[bot]' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            suffix: Windows-x64
            target: win
            installer_args: --win nsis --win msi --x64
          - os: windows-latest
            arch: arm64
            suffix: Windows-arm64
            target: win
            installer_args: --win nsis --win msi --arm64
          - os: macos-latest
            arch: x64
            suffix: macOS-x64
            target: mac
            installer_args: --mac dmg --x64
          - os: macos-latest
            arch: arm64
            suffix: macOS-arm64
            target: mac
            installer_args: --mac dmg --arm64
          - os: ubuntu-latest
            arch: x64
            suffix: Linux-x64
            target: linux
            installer_args: --linux AppImage --linux deb --linux rpm --x64
          - os: ubuntu-latest
            arch: arm64
            suffix: Linux-arm64
            target: linux
            installer_args: --linux AppImage --arm64

    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::AllowInsecureRepositories=true 2>/dev/null || true
          sudo apt-get install -y libx11-xcb1 libxtst6 libxrandr2 libasound2t64 libnss3 libgtk-3-0 xvfb rpm

      - run: npm ci
      - run: npm run build

      - name: Build installer
        run: node scripts/run-electron-builder.cjs ${{ matrix.installer_args }} --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build portable zip
        run: node scripts/run-electron-builder.cjs --${{ matrix.target }} --${{ matrix.arch }} --dir --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/dist | Out-Null

          Get-ChildItem release -File | Where-Object {
            $_.Extension -in '.exe', '.msi', '.dmg', '.AppImage', '.deb', '.rpm'
          } | ForEach-Object {
            $newname = "MCServerTools-${{ matrix.suffix }}$($_.Extension)"
            Copy-Item $_.FullName "release/dist/$newname"
          }

          $appdir = Get-ChildItem release -Directory | Where-Object {
            -not $_.Name.StartsWith('.') -and $_.Name -ne 'dist'
          } | Select-Object -First 1

          if ($appdir) {
            Compress-Archive -Path "$($appdir.FullName)/*" -DestinationPath "release/dist/MCServerTools-${{ matrix.suffix }}.zip" -Force
          }

      - uses: actions/upload-artifact@v4
        with:
          name: MCServerTools-${{ matrix.suffix }}
          path: release/dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const tag = process.env.GITHUB_REF_NAME
          const version = tag.replace(/^v/i, '')
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8')
          const lines = changelog.split(/\r?\n/)
          const start = lines.findIndex(line => line.trim() === `## ${tag}`)
          if (start === -1) {
            throw new Error(`Missing CHANGELOG.md section for ${tag}`)
          }

          const next = lines.findIndex((line, index) => index > start && /^##\s+/.test(line))
          const section = lines
            .slice(start + 1, next === -1 ? lines.length : next)
            .map(line => line.replace(/\s+$/, ''))
            .join('\n')
            .trim()
          const sectionLines = section.split(/\r?\n/)
          const notes = sectionLines
            .filter(line => /^\s*[-*]\s+/.test(line))
            .map(line => line.replace(/^\s*[-*]\s+/, '').trim().replace(/\u3002$/, ''))

          if (notes.length === 0) {
            throw new Error(`CHANGELOG.md section for ${tag} has no bullet notes`)
          }

          const body = `## v${version} \u66f4\u65b0\u5185\u5bb9\n\n${section}\n`
          fs.writeFileSync('release-body.md', `${body}\n`, 'utf8')
          fs.writeFileSync('release-notes.json', `${JSON.stringify(notes, null, 2)}\n`, 'utf8')
          NODE

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest.json on main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" > release.json

          node <<'NODE'
          const crypto = require('node:crypto')
          const fs = require('node:fs')
          const path = require('node:path')

          function walkFiles(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const fullPath = path.join(dir, entry.name)
              return entry.isDirectory() ? walkFiles(fullPath) : [fullPath]
            })
          }

          const tag = process.env.GITHUB_REF_NAME
          const version = tag.replace(/^v/i, '')
          const release = JSON.parse(fs.readFileSync('release.json', 'utf8'))
          const notes = JSON.parse(fs.readFileSync('release-notes.json', 'utf8'))
          const artifactFiles = new Map(walkFiles('artifacts').map(file => [path.basename(file), file]))
          const assets = []

          for (const asset of release.assets || []) {
            const assetPath = artifactFiles.get(asset.name)
            if (!assetPath) {
              throw new Error(`Missing downloaded artifact: ${asset.name}`)
            }

            assets.push({
              name: asset.name,
              url: asset.browser_download_url,
              size: asset.size,
              sha256: crypto.createHash('sha256').update(fs.readFileSync(assetPath)).digest('hex'),
            })
          }

          const latest = {
            repo: process.env.GITHUB_REPOSITORY,
            source: 'github-release',
            version,
            tag,
            title: tag,
            publishedAt: release.published_at,
            url: release.html_url,
            assets,
            assetsCount: assets.length,
            notes,
          }

          fs.writeFileSync('latest.json', `${JSON.stringify(latest, null, 2)}\n`, 'utf8')
          NODE

          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout main
          cp ../latest.json public/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/latest.json
          git commit -m "chore: update latest.json for ${GITHUB_REF_NAME}" || exit 0
          git push origin main
